<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="top-bar">
        <div class="top-row">
            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="🔎 Search . . .">
                <div id="cartIcon">
                    🛒 <span id="cartCount">0</span>
                </div>
            </form>
        </div>

        <div class="filters-wrapper">
            <div class="filter-selector">
                <button id="sortToggleBtn" class="filter-btn">Sort By ▼</button>
                <div id="sortDropdown" class="filter-dropdown hidden scrollable-dropdown">
                    <button class="filter-option" data-sort="price-asc">Price: Low to High ⬇️</button>
                    <button class="filter-option" data-sort="price-desc">Price: High to Low ⬆️</button>
                    <button class="filter-option" data-sort="alphabetical">Alphabetical (A-Z) 🔠</button>
                </div>
            </div>

                <div class="filter-selector">
                    <button id="tagsToggleBtn" class="filter-btn">🏷️ Tags ▼</button>
                    <div id="tagsDropdown" class="filter-dropdown hidden scrollable-dropdown">
                        <div class="tags-header">
                            <span class="tags-title">🏷️ Select Tags</span>
                            <button id="clearTagsBtn" class="clear-tags-btn">✕ Clear</button>
                        </div>
                        <div class="tags-search-wrapper">
                            <input type="text" id="tagsSearchInput" placeholder="🔍 Search tags..." class="tags-search-input">
                        </div>
                        <div id="tagsList" class="tags-grid"></div>
                    </div>
                </div>
        </div>
    </div>
    
    <!-- Модальное окно корзины -->
    <div id="cartModal" class="hidden">
        <div class="cart-modal-header">
            <h2>Your Cart</h2>
            <button id="closeCartModal" class="close-btn">✕</button>
        </div>
        <ul id="cartItems"></ul>
        <p>Total: <span id="totalPrice">0</span> ⭐️</p>
        <button id="checkoutBtn">Buy</button>
    </div>

    <div class="container">
        <div class="inner" id="productsContainer">
        </div>
    </div>

    <!-- Пагинация -->
    <div class="pagination">
        <button id="prevPage" class="pagination-btn"><b>❮</b></button>
        <div id="pageNumbers" class="page-numbers"></div>
        <button id="nextPage" class="pagination-btn"><b>❯</b></button>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
